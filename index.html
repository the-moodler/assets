<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moodler Assets</title>
  <meta name="description" content="The icons The Moodler's course readmes show on GitHub.">
  <link rel="icon" type="image/svg+xml" href="logo/moodler.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="logo/moodler-32.png">
  <link rel="apple-touch-icon" href="logo/moodler-256.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script>
    // Follow the system's light or dark setting.
    const dark = window.matchMedia("(prefers-color-scheme: dark)");
    const setTheme = () => document.documentElement.setAttribute("data-bs-theme", dark.matches ? "dark" : "light");
    setTheme();
    dark.addEventListener("change", setTheme);
  </script>
  <style>
    body { min-height: 100vh; background: linear-gradient(160deg, rgba(249, 128, 18, 0.14), transparent 55%), var(--bs-body-bg); }
    .logo { width: 112px; height: 112px; filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.18)); }
    .file-icons img { height: 36px; width: auto; }
    .btn-back { min-width: 16rem; }
  </style>
</head>
<body class="d-flex align-items-center">
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-10 col-lg-7">
        <div class="card border-0 shadow-lg rounded-4">
          <div class="card-body p-4 p-sm-5 text-center">
            <img class="logo mb-4" src="logo/moodler.svg" alt="The Moodler logo">
            <h1 class="display-5 fw-bold mb-3">Moodler Assets</h1>
            <p class="lead mb-2">Thank you for visiting Moodler Assets.</p>
            <p class="text-body-secondary mb-4">This site holds the icons that The Moodler's course readmes show on GitHub.</p>

            <div class="file-icons d-flex justify-content-center flex-wrap gap-3 mb-5" aria-hidden="true">
              <img src="icons/pdf.png" alt="">
              <img src="icons/docx.png" alt="">
              <img src="icons/pptx.png" alt="">
              <img src="icons/xlsx.png" alt="">
              <img src="icons/md.png" alt="">
              <img src="icons/zip.png" alt="">
              <img src="icons/mp4.png" alt="">
              <img src="icons/py.png" alt="">
            </div>

            <a id="back" class="btn btn-primary btn-lg rounded-pill px-5 py-3 fs-4 btn-back" href="https://github.com/the-moodler">&larr; Go back</a>

            <div class="mt-3">
              <a class="btn btn-outline-primary rounded-pill px-4" href="v/1/">Browse the icons (v1)</a>
            </div>

            <p class="small text-body-secondary mt-4 mb-0">
              <a class="link-secondary" href="https://github.com/the-moodler/assets">The icons on GitHub</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script>
    // Back to wherever the visitor came from; with nowhere to go back to, the link opens The Moodler on GitHub.
    document.getElementById("back").addEventListener("click", (event) => {
      if (window.history.length > 1) {
        event.preventDefault();
        window.history.back();
      }
    });
  </script>
</body>
</html>
