<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moodler Assets</title>
  <link rel="icon" href="icons/md-16.png">
  <style>
    :root { color-scheme: light dark; --text: #1f2328; --muted: #59636e; --page: #ffffff; --link: #0969da; }
    @media (prefers-color-scheme: dark) { :root { --text: #f0f6fc; --muted: #9198a1; --page: #0d1117; --link: #4493f8; } }
    body { margin: 0; background: var(--page); color: var(--text); font: 16px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    main { max-width: 36rem; margin: 15vh auto; padding: 0 16px; }
    h1 { margin: 0 0 0.5rem; font-size: 2rem; }
    p { color: var(--muted); }
    a { color: var(--link); }
  </style>
</head>
<body>
  <main>
    <h1>Moodler Assets</h1>
    <p>Thank you for visiting Moodler Assets. This site holds the icons that The Moodler's course readmes show on GitHub.</p>
    <p><a href="javascript:history.back()">Go back</a></p>
  </main>
</body>
</html>
